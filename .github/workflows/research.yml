name: Multi Asset Research Backtest
on:
  push:
    branches: [ main ]
    paths:
      - 'research_backtest.py'
      - '.github/workflows/research.yml'
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run historical research backtest
        run: python research_backtest.py
      - name: Upload research result
        uses: actions/upload-artifact@v4
        with:
          name: multi-asset-research-result
          path: research_result.json
