name: BTC Pilot Backtest
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run backtest
        run: python backtest.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: btc-pilot-result
          path: result.json
