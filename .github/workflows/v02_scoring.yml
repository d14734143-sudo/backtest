name: V02 Scoring Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - 'v02_scoring_backtest.py'
      - 'v03_final_selector.py'
      - '.github/workflows/v02_scoring.yml'

jobs:
  scoring:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT]
    env:
      SYMBOL: ${{ matrix.symbol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run lookahead-safe v0.2 scoring backtest
        run: python v02_scoring_backtest.py
      - name: Select robust v0.3 final rules
        run: python v03_final_selector.py
      - name: Upload scoring and final selection
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.symbol }}-v03-final
          path: |
            ${{ matrix.symbol == 'BTCUSDT' && 'btcusdt_v02_scoring_result.json' || matrix.symbol == 'ETHUSDT' && 'ethusdt_v02_scoring_result.json' || 'solusdt_v02_scoring_result.json' }}
            ${{ matrix.symbol == 'BTCUSDT' && 'btcusdt_v03_final_selection.json' || matrix.symbol == 'ETHUSDT' && 'ethusdt_v03_final_selection.json' || 'solusdt_v03_final_selection.json' }}
